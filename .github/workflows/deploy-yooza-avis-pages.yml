name: Publier Yooza Avis sur GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'yooza-avis/**'
      - '.github/workflows/deploy-yooza-avis-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer Yooza Avis
        uses: actions/upload-pages-artifact@v3
        with:
          path: './yooza-avis'

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
